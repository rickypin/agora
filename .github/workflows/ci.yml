name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 文档引用一致性（规则 9 的 CI 骨架，agora-xqa.2）：只要 git + python3，不进 matrix。
  # ② A 编号那一项需要 bd，CI 上没有（beads 的库不进 git），脚本会自己跳过并说明。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: doc lint
        run: scripts/doc-lint.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # tests/runtime_tmux.rs 跑在真实 tmux 的隔离 socket 上；22.04 给 3.2a 正好是下限。
      - name: install tmux (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux && tmux -V
      - name: install tmux (macos)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install tmux && tmux -V

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端先于 cargo：rust-embed 在编译期读 web/dist。
      - name: web deps
        run: npm --prefix web ci
      - name: web typecheck
        run: npm --prefix web run typecheck
      - name: web test
        run: npm --prefix web test
      - name: web build
        run: npm --prefix web run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all-targets
      # 真实 agent hook 冒烟（agora-3la.2）：对 runner 上装了的一等 agent 各跑一次 -p 无头最小交互，
      # SessionStart / Stop 的键集合与 testdata/<agent>/<version>/hooks/headless.jsonl 比对，漂移即红。
      # 没装的 agent 跳过——GitHub 托管 runner 上一个都没有，真比对发生在本机 / 自托管 runner；
      # #[ignore] 只是为了不混进上面那条普通 cargo test。
      - name: hook smoke (installed agents)
        run: cargo test --test hook_smoke -- --ignored --nocapture
