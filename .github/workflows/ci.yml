name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # tests/runtime_tmux.rs 跑在真实 tmux 的隔离 socket 上；22.04 给 3.2a 正好是下限。
      - name: install tmux (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux && tmux -V
      - name: install tmux (macos)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install tmux && tmux -V

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端先于 cargo：rust-embed 在编译期读 web/dist。
      - name: web deps
        run: npm --prefix web ci
      - name: web typecheck
        run: npm --prefix web run typecheck
      - name: web test
        run: npm --prefix web test
      - name: web build
        run: npm --prefix web run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all-targets
