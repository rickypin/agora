[package]
name = "agora"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "agora — 多 Agent 管理工具的单 binary daemon"
license = "UNLICENSED"
publish = false

[workspace]
members = ["."]

[dependencies]
# 唯一的并发模型（ADR-001 D8 施工约束 1）。子进程、PTY 都在它的 blocking 线程里跑。
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
rust-embed = { version = "8.12", features = ["include-exclude"] }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 模块边界用错误枚举（ADR-001 D8 施工约束 4）；万能错误 crate 被 tests/arch_boundary.rs 禁止。
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# 只用来给进程组发信号（terminate 不经 tmux，ADR-001 D2）。
libc = "0.2"
# Terminal Gateway 的 PTY（ADR-001 D5/D8）；unix 与 ConPTY 同一接口，是 D9 第二运行时的地基。
portable-pty = "0.9"
# metadata 库；bundled 免去三平台各自的 sqlite 版本差异（ADR-001 D8）。
rusqlite = { version = "0.40", features = ["bundled"] }
# 配对链接与 session token 的随机源、只落哈希（ADR-003 D2）。
getrandom = "0.4"
sha2 = "0.11"
base64 = "0.23"
# config.yaml 的解析器（serde_yaml 已停更，这是维护中的分叉；agora-xqa.9）。
serde_yaml_ng = "0.10"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
http-body-util = "0.1"
tempfile = "3"
# 只给 tests/events.rs 当 WS 客户端；版本跟 axum 的 tungstenite 对齐。
tokio-tungstenite = "0.29"
# tests/events.rs 收发 WS 帧用。
futures-util = "0.3"

[profile.release]
strip = true
lto = "thin"
