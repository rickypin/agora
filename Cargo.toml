[package]
name = "agora"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "agora — 多 Agent 管理工具的单 binary daemon"
license = "UNLICENSED"
publish = false

[workspace]
members = ["."]

[dependencies]
# 唯一的并发模型（ADR-001 D8 施工约束 1）。子进程、PTY 都在它的 blocking 线程里跑。
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
# peer 接缝（agora-7ku.11）：进程内 fake 把另一个实例的 Router 架在 tokio::io::duplex 上做真 WS
# 握手——hyper 直接服务单条连接（with_upgrades），不开 socket、不碰 TLS；两者本就在 axum 的依赖图里。
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# peer 链路的 WS 客户端（PeerTransport::connect_ws）；版本跟 axum 的 tungstenite 对齐。
tokio-tungstenite = "0.29"
rust-embed = { version = "8.12", features = ["include-exclude"] }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
# preserve_order：写回用户配置文件时不打乱他的键序（hooks install 的 diff 才只有加的行）。
serde_json = { version = "1.0", features = ["preserve_order"] }
# 模块边界用错误枚举（ADR-001 D8 施工约束 4）；万能错误 crate 被 tests/arch_boundary.rs 禁止。
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# 只用来给进程组发信号（terminate 不经 tmux，ADR-001 D2）。
libc = "0.2"
# Terminal Gateway 的 PTY（ADR-001 D5/D8）；unix 与 ConPTY 同一接口，是 D9 第二运行时的地基。
portable-pty = "0.9"
# metadata 库；bundled 免去三平台各自的 sqlite 版本差异（ADR-001 D8）。
rusqlite = { version = "0.40", features = ["bundled"] }
# 配对链接与 session token 的随机源、只落哈希（ADR-003 D2）。
getrandom = "0.4"
sha2 = "0.11"
base64 = "0.23"
# config.yaml 的解析器（serde_yaml 已停更，这是维护中的分叉；agora-xqa.9）。
serde_yaml_ng = "0.10"
# TLS 栈（ADR-003 D4 / D5；agora-7ku.10）全部选 rustls 生态、加密后端 ring：给 zuan 的二进制是
# Mac 上 `cargo zigbuild --target x86_64-unknown-linux-gnu` 交叉编译的，aws-lc-rs 要 cmake、
# openssl-sys 要目标平台的 OpenSSL，两者都会让交叉编译失败；所以每个 crate 都关默认特性再点名 ring。
# rustls：TLS 协议实现；服务端证书热加载靠自定义 ResolvesServerCert，客户端指纹钉住靠自定义 ServerCertVerifier。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# tokio-rustls：把 rustls 架到 tokio 的 TcpStream 上（TlsAcceptor / TlsConnector）。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# rcgen：self-signed 模式首次开 TLS 监听器时生成密钥与 10 年自签证书；rotate-key 也用它。
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# rustls-pki-types：证书 / 私钥的 DER 与 PEM 类型；external 模式读 cert_file / key_file 用它的 PEM 解析。
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
http-body-util = "0.1"
tempfile = "3"
# tests/events.rs 收发 WS 帧用。
futures-util = "0.3"

[profile.release]
strip = true
lto = "thin"
